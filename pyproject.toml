[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turntable-mesh"
version = "0.1.0"
description = "Command-line skeleton for object-only turntable reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
turntable-mesh = "turntable_mesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
